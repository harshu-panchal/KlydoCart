# KlydoCart — serve VPS image storage at /images/
# Merge the `location /images/` block into your existing HTTPS API server.
#
# STORAGE_ROOT=/var/storage
# PUBLIC_IMAGE_BASE_URL=https://api.example.com/images

server {
    listen 443 ssl http2;
    server_name api.example.com;

    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 12m;

    # Deny hidden / sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Map /images/* → /var/storage/*
    # Example: /images/products/2026/10/uuid.webp → /var/storage/products/2026/10/uuid.webp
    location /images/ {
        alias /var/storage/;

        autoindex off;
        disable_symlinks if_not_owner from=/var/storage;

        # UUID-based filenames are immutable
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        types {
            image/webp                             webp;
            image/jpeg                             jpg jpeg;
            image/png                              png;
            image/gif                              gif;
            application/pdf                        pdf;
        }
        default_type application/octet-stream;

        # Do not use try_files with alias — Nginx resolves alias paths directly.
        access_log off;
    }

    # Backend API / Socket.IO (PM2)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
